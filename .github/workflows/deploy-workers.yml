name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test export verifier
        run: npm run test:export

      - name: Build static site
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SITE_URL: https://gamectl.shop
          NEXT_PUBLIC_AD_KEY_320X50: ${{ secrets.NEXT_PUBLIC_AD_KEY_320X50 }}
          NEXT_PUBLIC_AD_KEY_160X600: ${{ secrets.NEXT_PUBLIC_AD_KEY_160X600 }}
          NEXT_PUBLIC_AD_KEY_160X300: ${{ secrets.NEXT_PUBLIC_AD_KEY_160X300 }}
          NEXT_PUBLIC_AD_KEY_300X250: ${{ secrets.NEXT_PUBLIC_AD_KEY_300X250 }}

      - name: Verify static export
        run: npm run verify:export

      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
